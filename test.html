<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Test</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: monospace; }
    #vid { width: 100vw; height: 100vh; object-fit: cover; background: #333; display: block; }
    #log {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      font-size: 13px; background: rgba(0,0,0,0.7);
      padding: 8px 10px; border-radius: 6px; max-width: 90vw;
      white-space: pre-line; line-height: 1.4;
    }
    #btn {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%); padding: 16px 32px;
      font-size: 18px; z-index: 10; border: none;
      border-radius: 50px; background: #2196f3; color: #fff;
    }
  </style>
</head>
<body>
  <div id="log">ready</div>
  <video id="vid" playsinline autoplay muted></video>
  <button id="btn">Включить камеру</button>

  <script>
    const log = (s) => document.getElementById('log').textContent += '\n' + s;
    const vid = document.getElementById('vid');
    const btn = document.getElementById('btn');

    btn.addEventListener('click', async () => {
      log('requesting…');
      try {
        if (!navigator.mediaDevices) throw new Error('mediaDevices недоступен (нужен HTTPS)');

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });

        const track = stream.getVideoTracks()[0];
        log('stream OK');
        log('label: ' + track.label);
        log('settings: ' + JSON.stringify(track.getSettings()));

        vid.srcObject = stream;
        vid.onloadedmetadata = () => log('meta: ' + vid.videoWidth + 'x' + vid.videoHeight);

        await vid.play();
        log('play() ok');

        setTimeout(() => {
          log('после 2с: readyState=' + vid.readyState +
              ' paused=' + vid.paused +
              ' размер=' + vid.videoWidth + 'x' + vid.videoHeight);
        }, 2000);
      } catch (e) {
        log('FAIL: ' + e.name + ' — ' + e.message);
      }
    });
  </script>
</body>
</html>
